name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, test, render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # The packages are committed artifacts: rebuilding must reproduce
      # them byte for byte, or the repo is lying about its own build.
      - run: npm run build
      - run: git diff --exit-code world world-recording
      # The shareable page renders both packages headless.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # The manifests and state documents validate against the format's
      # normative schemas, resolved by npm run validate: the installed
      # package first, then a sibling checkout, then the spec
      # repository (the runner has neither package schemas nor a
      # sibling, so it fetches).
      - name: Validate against the Open World Format schemas
        run: npm run validate
